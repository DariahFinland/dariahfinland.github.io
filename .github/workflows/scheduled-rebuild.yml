# .github/workflows/scheduled-rebuild.yml
#
# Replaces the old GitHub-Pages-targeting deploy.yml. Cloudflare Pages
# builds and deploys automatically on every push to main -- no GitHub
# Actions involvement needed for that anymore. The ONE thing Cloudflare
# doesn't do natively is a scheduled rebuild with no push (needed so
# events flip from upcoming to past on their own, even with zero content
# changes) -- this workflow's only job is pinging Cloudflare's Deploy Hook
# on a daily cron to trigger that.
#
# Setup required:
#   1. In Cloudflare Pages: Settings -> Builds & deployments -> Deploy Hooks
#      -> create one for the `main` branch, copy the generated URL.
#   2. Add it as a repo secret named CLOUDFLARE_DEPLOY_HOOK_URL
#      (Settings -> Secrets and variables -> Actions).

name: Scheduled rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloudflare Pages deploy hook
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
