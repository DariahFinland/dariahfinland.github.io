# .github/workflows/deploy.yml
#
# Replaces scheduled-rebuild.yml (which only pinged Cloudflare -- no longer
# relevant now that hosting is back on GitHub Pages). Builds and deploys on
# every push to main, plus a daily cron so events flip from upcoming to
# past on their own, even with zero content changes.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Social sharing: only print what would be posted to Buffer'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 needs node:sqlite, only available from Node 22.5+
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site (fetch GoatCounter stats + astro build + pagefind indexing)
        run: pnpm build
        env:
          # GoatCounter API token with "Read statistics" permission (repo
          # Settings > Secrets and variables > Actions). Optional: without it
          # the /statistics page just keeps showing its placeholder.
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Shares posts/events that editors flagged "Share on social media" in the
  # CMS to Buffer. Runs only after a successful deploy (the links and images
  # must be live first) and not on the daily cron. A failure here never
  # affects the site itself. Needs the BUFFER_API_KEY secret; without it the
  # script does nothing. See scripts/share-to-buffer.mjs for the options.
  share:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Share new posts and events via Buffer
        run: node scripts/share-to-buffer.mjs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables):
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_IDS: ${{ vars.BUFFER_CHANNEL_IDS }}
          SITE_URL: https://www.dariah.fi
          DRY_RUN: ${{ inputs.dry_run }}