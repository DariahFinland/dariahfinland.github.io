# .pages.yml
#
# This is what turns your GitHub repo into an editable CMS at pagescms.org.
# Every collection/field here mirrors src/content.config.ts -- if you add a
# field to the Astro schema later, add the matching field here too (and vice
# versa), or PagesCMS and Astro will quietly disagree about what a document
# should look like.

media:
  input: public/media
  output: /media

content:
  # ---------- categories ----------
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    view:
      fields: [title]
      primary: title
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }

  # ---------- local-offices ----------
  - name: local-offices
    label: Local Offices
    type: collection
    path: src/content/local-offices
    view:
      fields: [name]
      primary: name
      sort: [name]
    fields:
      - { name: name, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: logo, type: image }
      - { name: shortDescription, type: text }
      - { name: externalUrl, type: string }
      - name: contacts
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: photo, type: image }
          - { name: url, type: string }
          - { name: email, type: string }
          - { name: note, type: string }

  # ---------- affiliated-groups ----------
  - name: affiliated-groups
    label: Affiliated Groups
    type: collection
    path: src/content/affiliated-groups
    view:
      fields: [name, localOffice]
      primary: name
      sort: [name]
    fields:
      - { name: name, type: string, required: true }
      - { name: logo, type: image }
      - { name: externalUrl, type: string, required: true }
      - name: expertise
        label: Expertise tags
        type: string
        list: true
      - { name: contactName, type: string }
      - { name: contactUrl, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{id}" }
      - { name: body, label: Description, type: rich-text }

  # ---------- tools ----------
  - name: tools
    label: Tools
    type: collection
    path: src/content/tools
    view:
      fields: [name, localOffice]
      primary: name
      sort: [name]
      search: ["name", "localOffice", "description"]
    fields:
      - { name: name, type: string, required: true }
      - name: accessLinks
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string, required: true }
      - { name: tutorialUrl, type: string }
      - name: contacts
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: url, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{id}" }
      - name: collaborators
        type: reference
        options: { collection: local-offices, multiple: true, value: "{id}" }
      - { name: body, label: Description, type: rich-text }
  
  # ---------- trainings ----------
  - name: trainings
    label: Trainings
    type: collection
    path: src/content/trainings
    view:
      fields: [title, group, localOffice]
      primary: title
      sort: [title]
    fields:
      - { name: title, type: string, required: true }
      - { name: url, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{id}" }
      - { name: group, type: string }
      - { name: levelTags, type: string }
      - { name: body, label: Description, type: rich-text }

  # ---------- events ----------
  - name: events
    label: Events
    type: collection
    path: src/content/events
    view:
      fields: [title, startDate, cancelled]
      primary: title
      sort: [startDate]
      default: { sort: startDate, order: desc }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: startDate, type: date, required: true }
      - { name: startTime, type: string, description: 'e.g. 12:15' }
      - { name: endDate, type: date }
      - { name: endTime, type: string, description: 'e.g. 14:00' }
      - { name: cancelled, type: boolean, default: false }
      - { name: location, type: string }
      - { name: isOnline, type: boolean, default: false }
      - { name: registrationUrl, type: string }
      - { name: featuredImage, type: image }
      - name: localOffice
        label: Organising office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{id}" }
      - { name: body, label: Description, type: rich-text }

  # ---------- posts ----------
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    view:
      fields: [title, publishedAt]
      primary: title
      sort: [publishedAt]
      default: { sort: publishedAt, order: desc }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: heroImage, type: image }
      - { name: heroImageAlt, type: string }
      - name: categories
        type: reference
        options: { collection: categories, multiple: true, value: "{id}" }
      - name: relatedPosts
        type: reference
        options: { collection: posts, multiple: true, value: "{id}" }
      - name: authors
        type: string
        list: true
      - { name: publishedAt, type: date, required: true }
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
          - { name: image, type: image }
      - { name: body, label: Content, type: rich-text }

  # ---------- pages ----------
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - name: hero
        type: object
        fields:
          - name: type
            type: select
            options: { values: [none, lowImpact, mediumImpact, highImpact] }
            default: lowImpact
          - { name: richText, type: rich-text }
          - name: links
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string, required: true }
              - { name: newTab, type: boolean }
          - { name: media, type: image }
          - { name: mediaAlt, type: string }
      - name: layout
        label: Page sections
        type: block
        list: true
        blockKey: blockType # matches Astro's discriminatedUnion('blockType', ...) key exactly
        blocks:
          - name: content
            label: Content columns
            fields:
              - name: columns
                type: object
                list: true
                fields:
                  - name: size
                    type: select
                    options: { values: [oneThird, half, twoThirds, full] }
                    default: oneThird
                  - { name: richText, type: rich-text }
                  - name: link
                    type: object
                    fields:
                      - { name: label, type: string }
                      - { name: url, type: string }
          - name: cta
            label: Call to Action
            fields:
              - { name: richText, type: rich-text }
              - name: links
                type: object
                list: true
                fields:
                  - { name: label, type: string, required: true }
                  - { name: url, type: string, required: true }
                  - { name: newTab, type: boolean }
          - name: mediaBlock
            label: Media
            fields:
              - { name: media, type: image, required: true }
              - { name: mediaAlt, type: string }
          - name: archive
            label: Post Archive
            fields:
              - { name: introRichText, type: rich-text }
              - name: populateBy
                type: select
                options: { values: [collection, selection] }
                default: collection
              - name: categories
                type: reference
                options: { collection: categories, multiple: true, value: "{id}" }
              - { name: limit, type: number, default: 10 }
              - name: selectedDocs
                label: Selected posts
                type: reference
                options: { collection: posts, multiple: true, value: "{id}" }
          - name: tabsBlock
            label: Tabs
            fields:
              - name: tabs
                type: object
                list: true
                fields:
                  - { name: label, type: string, required: true }
                  - name: listType
                    type: select
                    options: { values: [none, affiliatedGroups, tools] }
                    default: none
                  - { name: richText, type: rich-text }
          - name: trainingSections
            label: Training Sections
            fields:
              - { name: heading, type: string, required: true }
              - { name: intro, type: text }
              - name: trainings
                label: Trainings shown in this section
                type: reference
                options: { collection: trainings, multiple: true, value: "{id}" }
          - name: upcomingEvents
            label: Upcoming Events
            fields:
              - { name: heading, type: string, default: 'Upcoming Events' }
              - { name: limit, type: number, default: 3 }
              - { name: viewAllLink, type: string, default: '/events' }
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
          - { name: image, type: image }

  # ---------- header/footer (site-wide nav, not a repeated collection) ----------
  - name: site-nav
    label: Site Navigation
    type: file
    path: src/data/globals.json
    fields:
      - name: header
        type: object
        fields:
          - name: navItems
            label: Header nav items
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string }
              - { name: newTab, type: boolean }
      - name: footer
        type: object
        fields:
          - name: navItems
            label: Footer nav items (incl. social links -- add a bsky.app or youtube.com URL to get an icon instead of text)
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string }
              - { name: newTab, type: boolean }