# rahti/deployment.yaml
#
# Adapted from the original Payload project's rahti/deployment.yaml.
# Deliberately simpler in two ways:
#   - No PersistentVolumeClaim for media -- it now lives in public/media/,
#     tracked in Git and baked into the container image at build time.
#   - No secretRef for app env vars YET -- Phase 1 has no external
#     dependencies (no database, no Tina backend wired in yet). That gets
#     added in Phase 3 once the self-hosted Tina backend needs
#     GITHUB_PERSONAL_ACCESS_TOKEN / MONGODB_URI / etc.
#
# This is applied ONCE by hand (oc apply -f rahti/deployment.yaml) to
# create the Deployment/Service/Route. After that, the GitHub Actions
# workflow only updates the image tag on pushes -- it does not re-apply
# this file automatically. If you change something in here later (e.g.
# resource limits, or adding the Phase 3 secretRef), re-run oc apply by
# hand to pick it up.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dariah-fi-astro
  labels:
    app: dariah-fi-astro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dariah-fi-astro
  template:
    metadata:
      labels:
        app: dariah-fi-astro
    spec:
      containers:
        - name: dariah-fi-astro
          image: ghcr.io/dariahfinland/dariahfinland.github.io:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dariah-fi-astro
spec:
  selector:
    app: dariah-fi-astro
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dariah-fi-astro
spec:
  to:
    kind: Service
    name: dariah-fi-astro
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
