# .github/workflows/deploy.yml
#
# Replaces the old GitHub Pages workflow. Adapted directly from the
# original Payload project's Rahti deploy workflow -- same build-push-to-
# GHCR-then-oc-set-image pattern, just pointed at this repo's image and the
# new deployment name.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions)
# -- if these already exist as org-level secrets shared from the old Payload
# repo, nothing to do; otherwise they need adding fresh to THIS repo, since
# secrets don't carry over automatically between repos:
#   RAHTI_TOKEN    -- oc login token
#   RAHTI_SERVER   -- Rahti API server URL
#   RAHTI_PROJECT  -- the OpenShift project/namespace to deploy into
#
# IMPORTANT: rahti/deployment.yaml must be applied by hand once
# (oc apply -f rahti/deployment.yaml) before this workflow's `oc set image`
# step has a deployment to actually target.

name: Deploy to Rahti

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so events flip from upcoming to past on their own, even
    # with zero content changes.
    - cron: '0 3 * * *' # 03:00 UTC daily

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      - name: Login to Rahti
        run: |
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}

      - name: Set project namespace
        run: |
          oc project ${{ secrets.RAHTI_PROJECT }}

      - name: Update image and restart deployment
        run: |
          oc set image deployment/dariah-fi-astro dariah-fi-astro=ghcr.io/${{ github.repository }}:${{ github.sha }}
          oc rollout status deployment/dariah-fi-astro --timeout=120s