# .pages.yml
#
# This is what turns your GitHub repo into an editable CMS at pagescms.org.
# Every collection/field here mirrors src/content.config.ts -- if you add a
# field to the Astro schema later, add the matching field here too (and vice
# versa), or PagesCMS and Astro will quietly disagree about what a document
# should look like.

media:
  input: public/media
  output: /media

content:
  # ---------- tags ----------
  - name: tags
    label: Tags
    type: collection
    path: src/content/tags
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
    fields:
      - { name: title, type: string, required: true }
 
  # ---------- local-offices ----------
  - name: local-offices
    label: Local Offices
    type: collection
    path: src/content/local-offices
    filename: "{primary}.md"
    view:
      fields: [name]
      primary: name
      sort: [name]
    fields:
      - { name: name, type: string, required: true }
      - { name: logo, type: image }
      - { name: shortDescription, type: text }
      - { name: externalUrl, type: string }
      - name: contacts
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: photo, type: image }
          - { name: url, type: string }
          - { name: email, type: string }
          - { name: note, type: string }

  # ---------- affiliated-groups ----------
  - name: affiliated-groups
    label: Affiliated Groups
    type: collection
    path: src/content/affiliated-groups
    filename: "{primary}.md"
    view:
      fields: [name, localOffice, expertise]
      primary: name
      sort: [name]
      search: [name, localOffice, expertise, body]
    fields:
      - { name: name, type: string, required: true }
      - { name: logo, type: image }
      - { name: externalUrl, type: string, required: true }
      - name: expertise
        label: Expertise tags
        type: reference
        options: { collection: tags, multiple: true, label: "{title}", value: "{path}" }
      - { name: contactName, type: string }
      - { name: contactUrl, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{path}" }
      - { name: body, label: Description, type: rich-text }

  # ---------- tools ----------
  - name: tools
    label: Tools
    type: collection
    path: src/content/tools
    filename: "{primary}.md"
    view:
      fields: [name, localOffice]
      primary: name
      sort: [name]
      search: [name, localOffice, body]
    fields:
      - { name: name, type: string, required: true }
      - name: accessLinks
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string, required: true }
      - { name: tutorialUrl, type: string }
      - name: contacts
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: url, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{path}" }
      - name: collaborators
        label: Collaborators
        type: reference
        options: { collection: local-offices, multiple: true, value: "{path}" }
      - { name: body, label: Description, type: rich-text }
  
  # ---------- trainings ----------
  - name: trainings
    label: Trainings
    type: collection
    path: src/content/trainings
    filename: "{primary}.md"
    view:
      fields: [title, group, localOffice]
      primary: title
      sort: [title]
      search: [title, group, localOffice, levelTags, body]
    fields:
      - { name: title, type: string, required: true }
      - { name: url, type: string }
      - name: localOffice
        label: Local Office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{path}" }
      - { name: group, type: string }
      - { name: levelTags, type: string }
      - { name: body, label: Description, type: rich-text }

  # ---------- events ----------
  - name: events
    label: Events
    type: collection
    path: src/content/events
    filename: "{primary}.md"
    view:
      fields: [title, startDate, localOffice]
      primary: title
      sort: [startDate]
      default: { sort: startDate, order: desc }
      search: [title, localOffice, body]
    fields:
      - { name: title, type: string, required: true }
      - { name: startDate, type: date, required: true }
      - { name: startTime, type: select, options: { values: ["07:00", "07:15", "07:30", "07:45", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "09:45", "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00", "20:15", "20:30", "20:45", "21:00", "21:15", "21:30", "21:45", "22:00", "22:15", "22:30", "22:45", "23:00"] } }
      - { name: endDate, type: date }
      - { name: endTime, type: select, options: { values: ["07:00", "07:15", "07:30", "07:45", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "09:45", "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00", "20:15", "20:30", "20:45", "21:00", "21:15", "21:30", "21:45", "22:00", "22:15", "22:30", "22:45", "23:00"] } }
      - { name: registrationUrl, type: string }
      - { name: featuredImage, type: image }
      - name: localOffice
        label: Organising office
        type: reference
        options: { collection: local-offices, label: "{name}", value: "{path}" }
      - { name: body, label: Description, type: rich-text }

  # ---------- posts ----------
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      fields: [title, publishedAt, authors, tags]
      primary: title
      sort: [publishedAt]
      default: { sort: publishedAt, order: desc }
      search: [title, authors, tags, body]
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: heroImage, type: image }
      - { name: heroImageAlt, type: string }
      - name: tags
        type: reference
        options: { collection: tags, multiple: true, label: "{title}", value: "{path}" }
      - name: relatedPosts
        type: reference
        options: { collection: posts, multiple: true, value: "{path}" }
      - name: authors
        type: string
        list: true
      - { name: publishedAt, type: date, required: true }
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
          - { name: image, type: image }
      - { name: body, label: Content, type: rich-text }

  # ---------- pages ----------
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - name: hero
        type: object
        fields:
          - name: type
            type: select
            options: { values: [none, lowImpact, mediumImpact, highImpact] }
            default: lowImpact
          - { name: richText, type: rich-text }
          - name: links
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string, required: true }
              - { name: newTab, type: boolean }
          - { name: media, type: image }
          - { name: mediaAlt, type: string }
      - name: layout
        label: Page sections
        type: block
        list: true
        blockKey: blockType # matches Astro's discriminatedUnion('blockType', ...) key exactly
        blocks:
          - name: content
            label: Content columns
            fields:
              - name: columns
                type: object
                list: true
                fields:
                  - name: size
                    type: select
                    options: { values: [oneThird, half, twoThirds, full] }
                    default: oneThird
                  - { name: richText, type: rich-text }
                  - name: link
                    type: object
                    fields:
                      - { name: label, type: string }
                      - { name: url, type: string }
          - name: cta
            label: Call to Action
            fields:
              - { name: richText, type: rich-text }
              - name: links
                type: object
                list: true
                fields:
                  - { name: label, type: string, required: true }
                  - { name: url, type: string, required: true }
                  - { name: newTab, type: boolean }
          - name: mediaBlock
            label: Media
            fields:
              - { name: media, type: image, required: true }
              - { name: mediaAlt, type: string }
          - name: archive
            label: Post Archive
            fields:
              - { name: introRichText, type: rich-text }
              - name: populateBy
                type: select
                options: { values: [collection, selection] }
                default: collection
              - name: tags
                type: reference
                options: { collection: tags, multiple: true, label: "{title}", value: "{path}" }
              - { name: limit, type: number, default: 10 }
              - name: selectedDocs
                label: Selected posts
                type: reference
                options: { collection: posts, multiple: true, value: "{path}" }
          - name: tabsBlock
            label: Tabs
            fields:
              - name: tabs
                type: object
                list: true
                fields:
                  - { name: label, type: string, required: true }
                  - name: listType
                    type: select
                    options: { values: [none, affiliatedGroups, tools] }
                    default: none
                  - { name: richText, type: rich-text }
          - name: trainingSections
            label: Training Sections
            fields:
              - { name: heading, type: string, required: true }
              - { name: intro, type: text }
              - name: trainings
                label: Trainings shown in this section
                type: reference
                options: { collection: trainings, multiple: true, value: "{path}" }
          - name: upcomingEvents
            label: Upcoming Events
            fields:
              - { name: heading, type: string, default: 'Upcoming Events' }
              - { name: limit, type: number, default: 3 }
              - { name: viewAllLink, type: string, default: '/events' }
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
          - { name: image, type: image }

  # ---------- header/footer (site-wide nav, not a repeated collection) ----------
  - name: site-nav
    label: Site Navigation
    type: file
    path: src/data/globals.json
    fields:
      - name: header
        type: object
        fields:
          - name: navItems
            label: Header nav items
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string }
              - { name: newTab, type: boolean }
      - name: footer
        type: object
        fields:
          - name: navItems
            label: Footer nav items (incl. social links -- add a bsky.app or youtube.com URL to get an icon instead of text)
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: url, type: string }
              - { name: newTab, type: boolean }