# .github/workflows/publish.yml
#
# Triggered by PagesCMS's "Publish to Live Site" action button (see the
# `actions:` entry in .pages.yml). Fast-forwards main to match whatever
# branch was open in PagesCMS at the time (staging) -- this works as a
# simple fast-forward specifically because nothing else ever commits to
# that branch except PagesCMS edits building on top of main.

name: Publish to main

on:
  workflow_dispatch:
    inputs:
      payload:
        description: >
          Contextual info PagesCMS sends automatically (commit sha, entry
          path, etc.) -- not used by this workflow, just needs to be
          declared here or GitHub rejects the dispatch call entirely.
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the branch that was open in PagesCMS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to match this branch
        run: git push origin HEAD:main